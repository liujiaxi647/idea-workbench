<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: app shell with a top bar; two-column workbench (suggestions | workspace) that stacks on phones */
:root{
  --bg:#F4F3EF; --surface:#FDFDFB; --ink:#1B1D24; --muted:#5C6070; --line:#DEDCD4; --line-strong:#BDBAB0; --chip:#ECEAE3;
  --accent:#3443B8; --accent-ink:#FDFDFB; --accent-soft:#E3E6F8; --accent-soft-ink:#24308A;
  --card:#FFF4DE; --card-line:#E9C77B; --card-label:#7A4F00; --card-btn:#5A3B00;
  --keep:#E7F1EE; --keep-line:#A9CFC5; --keep-ink:#1F5F54; --danger:#9A2E1C; --danger-soft:#FBEDEA;
  --f-display:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15161B; --surface:#1E2027; --ink:#ECEDF2; --muted:#A3A7B5; --line:#34363F; --line-strong:#4A4D58; --chip:#2A2C34;
  --accent:#8E9BFF; --accent-ink:#12142A; --accent-soft:#262B4D; --accent-soft-ink:#C6CCFF;
  --card:#33291A; --card-line:#6B5326; --card-label:#F2C46B; --card-btn:#F2C46B;
  --keep:#19302B; --keep-line:#2F5A50; --keep-ink:#8FD3C2; --danger:#FF9C88; --danger-soft:#3A221E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15161B; --surface:#1E2027; --ink:#ECEDF2; --muted:#A3A7B5; --line:#34363F; --line-strong:#4A4D58; --chip:#2A2C34;
  --accent:#8E9BFF; --accent-ink:#12142A; --accent-soft:#262B4D; --accent-soft-ink:#C6CCFF;
  --card:#33291A; --card-line:#6B5326; --card-label:#F2C46B; --card-btn:#F2C46B;
  --keep:#19302B; --keep-line:#2F5A50; --keep-ink:#8FD3C2; --danger:#FF9C88; --danger-soft:#3A221E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
.topbar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;background:none;border:0;padding:0}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:13px;font-weight:600}
.steps li{padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps li.done{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
.steps li.now{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.pill{padding:5px 10px;border-radius:8px;background:var(--chip);font-weight:600}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
main{padding-block:28px 48px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.side{flex:1 1 320px;max-width:420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.mainc{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.lead{font-size:16px;color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14px;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-outline{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn-dashed{background:transparent;border:1.5px dashed var(--line-strong);color:var(--ink)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600}
.input,.area{width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:12px 14px;font-size:15px}
.input{min-height:46px}
.area{min-height:120px;resize:vertical;line-height:1.55}
.area.focus{border-color:var(--accent);border-width:1.5px}
.brief{font-size:18px;font-weight:600;line-height:1.45}
.ideas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ideas li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.num{flex:none;width:26px;height:26px;border-radius:999px;background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--chip);gap:4px}
.seg button{flex:1;min-height:42px;border-radius:9px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[disabled]{opacity:.5;cursor:not-allowed}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--chip);font-size:13px;line-height:1.45}
.sug{background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.sug.active{border:2px solid var(--ink);padding:15px}
.sug .lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--card-label)}
.sug h3{font-family:var(--f-body);font-size:17px}
.sug .acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.btn-card{background:transparent;border-color:var(--card-line);color:var(--card-btn)}
.twists{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.twists legend{font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border:2px solid var(--accent);padding:11px 13px}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tab.done{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.recap{padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14px}
.keep{padding:12px 14px;border-radius:10px;background:var(--keep);border:1px solid var(--keep-line);font-size:14px}
.keep b{color:var(--keep-ink)}
.from{padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--card-line);font-size:14px}
.from b{color:var(--card-label)}
.vers{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.vchip{min-height:30px;padding:0 10px;border-radius:999px;border:0;background:var(--chip);font-weight:600;font-size:13px}
.vchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.empty{align-items:center;text-align:center;padding:36px 24px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:720px;text-align:left}
.mini{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mini b{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.status{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
thead th{background:var(--chip);border-top:0;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px}
.b-good{background:var(--keep);color:var(--keep-ink)}
.b-bad{background:var(--card);color:var(--card-label)}
.okc{color:var(--keep-ink);font-weight:600}
.setup-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.setup-grid > *{flex:1 1 340px;min-width:0}
.plan{background:var(--card);border:1px solid var(--card-line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.plan .lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--card-label)}
.plan h2{font-size:22px}
.planline{font-size:16px}
.plan .k{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--card-label);margin-bottom:4px}
.plan-body{display:flex;flex-wrap:wrap;gap:20px;padding-top:12px;border-top:1px solid var(--card-line)}
.plan-text{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:14px;font-size:14px}
.plan-text ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.phone-wrap{flex:0 0 auto;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.phone{width:220px;max-width:100%;height:430px;border:9px solid var(--ink);border-radius:30px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;padding:16px 14px 14px;gap:10px;font-size:12px;position:relative;color:var(--ink)}
.ph-head{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ph-app{font-weight:700;font-size:14px}
.ph-sub{font-size:11px;color:var(--muted)}
.ph-icon{display:flex;justify-content:center;color:var(--accent);margin-top:14px}
.ph-big{font-family:var(--f-display);font-size:28px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ph-meter{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;flex:none}
.ph-meter i{display:block;height:100%;background:var(--accent)}
.ph-rows{display:flex;flex-direction:column;gap:6px}
.ph-row{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.ph-row b{font-weight:600}
.ph-bar{display:grid;grid-template-columns:38px 1fr 22px;align-items:center;gap:6px}
.ph-cap{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.4}
.ph-btn{margin-top:auto;text-align:center;padding:9px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.ph-btn.off{background:var(--chip);color:var(--muted)}
.ph-pop{position:absolute;left:12px;right:12px;top:170px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ph-live{position:relative;flex:0 0 170px;border-radius:10px;background:var(--ink);color:var(--line-strong);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.scr-nav{display:flex;align-items:center;gap:6px;width:240px;max-width:100%}
.scr-arrow{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--card-line);background:var(--surface);font-size:20px;line-height:1;color:var(--ink)}
.scr-arrow[disabled]{opacity:.35;cursor:default}
.scr-chips{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.scr-chip{min-height:30px;padding:4px 8px;border-radius:8px;border:1px solid transparent;background:transparent;font-size:12px;text-align:left;color:var(--card-label);font-weight:600}
.scr-chip[aria-pressed="true"]{background:var(--surface);border-color:var(--card-line);color:var(--ink)}
.ph-livepill{position:absolute;top:8px;left:8px;background:var(--danger);color:var(--surface);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.6px}
@media (max-width:640px){.grid3,.grid2{grid-template-columns:1fr}.panel{padding:18px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- content: tasks and the fixed card pool ---------- */
var TASKS = {
  t1:{short:"Task 1 · Individual project", text:"Design a phone feature that helps university students stay focused while studying, while keeping them in control of when and how they use it."},
  t2:{short:"Task 2 · Group project", text:"Design a phone feature that helps university students finish group projects, while giving every member a say in roles and progress."}
};
var TWISTS = {
  exaggerate:{label:"Push it to the extreme", hint:"Too much, too often, too far.", rname:"Exaggerate"},
  control:{label:"Flip who decides", hint:"Someone else makes the call.", rname:"Take control"},
  impractical:{label:"Make it unrealistic", hint:"Assume something that can't really exist.", rname:"Impractical"}
};
var CARDS = [
  {id:"B-01",task:"t1",type:"bad",d:"exaggerate",from:"G-01",title:"Total Lockdown",text:"When a session starts, every phone function locks, including calls, for six hours."},
  {id:"B-02",task:"t1",type:"bad",d:"control",from:"G-01",title:"Professor Mode",text:"Your professor schedules your focus sessions and starts them remotely."},
  {id:"B-03",task:"t1",type:"bad",d:"impractical",from:"G-01",title:"Focus Band",text:"A brain-wave wristband notices when your attention drifts and pauses your phone."},
  {id:"B-04",task:"t1",type:"bad",d:"exaggerate",from:"G-02",title:"Constant Recap",text:"A recap pops up every two minutes during the session to report your focus."},
  {id:"B-05",task:"t1",type:"bad",d:"control",from:"G-02",title:"Parent Report",text:"Your focus recap goes to your parents, who decide whether you studied enough."},
  {id:"B-06",task:"t1",type:"bad",d:"impractical",from:"G-02",title:"Stillness Chair",text:"A sensor in your desk chair measures how still you sat and turns it into your focus score."},
  {id:"B-07",task:"t1",type:"bad",d:"exaggerate",from:"G-03",title:"Buddy Livestream",text:"Your friend watches a live video of you for the entire session."},
  {id:"B-08",task:"t1",type:"bad",d:"control",from:"G-03",title:"Buddy Lock",text:"Your friend decides when your session can end, and you cannot stop it yourself."},
  {id:"B-09",task:"t1",type:"bad",d:"impractical",from:"G-03",title:"Instant Campus Match",text:"Every student on campus is matched in real time with a study partner in the same building."},
  {id:"B-10",task:"t1",type:"bad",d:"exaggerate",from:"G-04",title:"Semester Blackout",text:"Whenever you study, all notifications are deleted for the rest of the semester."},
  {id:"B-11",task:"t1",type:"bad",d:"control",from:"G-04",title:"App Decides",text:"The app decides on its own which messages you may see, and you cannot change it."},
  {id:"B-12",task:"t1",type:"bad",d:"impractical",from:"G-04",title:"Mind-Read Filter",text:"Your phone reads your mind to know which notifications you would actually want."},
  {id:"B-21",task:"t2",type:"bad",d:"exaggerate",from:"G-11",title:"Micro-Task Flood",text:"The project is split into hundreds of tiny tasks, and each member must claim twenty a day."},
  {id:"B-22",task:"t2",type:"bad",d:"control",from:"G-11",title:"Leader Assigns",text:"The group leader assigns every task, and no one else can change it."},
  {id:"B-23",task:"t2",type:"bad",d:"impractical",from:"G-11",title:"Auto-Split From Chats",text:"An AI reads every message members have ever sent and splits the work perfectly by skill."},
  {id:"B-24",task:"t2",type:"bad",d:"exaggerate",from:"G-12",title:"Hourly Check-In",text:"Everyone must update the board every hour, day and night, or the whole group is alerted."},
  {id:"B-25",task:"t2",type:"bad",d:"control",from:"G-12",title:"AI Judge",text:"An AI scores each member's contribution, and members cannot question the score."},
  {id:"B-26",task:"t2",type:"bad",d:"impractical",from:"G-12",title:"Smart Pens",text:"Smart pens track how much each member actually writes to measure contribution."},
  {id:"B-27",task:"t2",type:"bad",d:"exaggerate",from:"G-13",title:"Daily Marathon",text:"The app books a two-hour group meeting every single day until the project ends."},
  {id:"B-28",task:"t2",type:"bad",d:"control",from:"G-13",title:"Instructor Schedules",text:"The instructor sets all group meeting times, and students cannot reschedule."},
  {id:"B-29",task:"t2",type:"bad",d:"impractical",from:"G-13",title:"Timetable Rewrite",text:"The app rearranges everyone's classes so all members are always free at the same time."},
  {"id":"t1-b01-exaggerate","task":"t1","type":"bad","d":"exaggerate","from":"t1-b01","title":"Break Siren","text":"Each break starts and ends with a siren loud enough to wake your whole floor.","src":"Track A"},
  {"id":"t1-b01-control","task":"t1","type":"bad","d":"control","from":"t1-b01","title":"Coach Picks Breaks","text":"An AI coach decides when you study and when you rest, and your own timer settings are ignored.","src":"Track A"},
  {"id":"t1-b01-impractical","task":"t1","type":"bad","d":"impractical","from":"t1-b01","title":"Snack From Nowhere","text":"When each break starts, a fresh snack you like appears beside your phone out of thin air.","src":"Track A"},
  {"id":"t1-b02-exaggerate","task":"t1","type":"bad","d":"exaggerate","from":"t1-b02","title":"Fourteen-Hour Flip","text":"Every flip starts a fourteen-hour study timer, the shortest length the app offers.","src":"Track A"},
  {"id":"t1-b02-control","task":"t1","type":"bad","d":"control","from":"t1-b02","title":"RA Sets the Timer","text":"Your residence hall RA sets the length of every flip timer, replacing the one you chose.","src":"Track A"},
  {"id":"t1-b02-impractical","task":"t1","type":"bad","d":"impractical","from":"t1-b02","title":"Silent Building","text":"Flipping your phone face down makes every noise in the building disappear until you flip it back.","src":"Track A"},
  {"id":"t1-b03-control","task":"t1","type":"bad","d":"control","from":"t1-b03","title":"Library Picks Sound","text":"The campus library chooses what sound plays on your phone while you study, and you cannot switch it off.","src":"Track A"},
  {"id":"t1-b03-impractical","task":"t1","type":"bad","d":"impractical","from":"t1-b03","title":"Dream Soundtrack","text":"The app composes music directly inside your head that perfectly matches the topic you are studying.","src":"Track A"},
  {"id":"t1-b04-control","task":"t1","type":"bad","d":"control","from":"t1-b04","title":"Advisor Colors","text":"Your academic advisor decides when your screen turns gray and when you earn colors back.","src":"Track A"},
  {"id":"t1-b04-impractical","task":"t1","type":"bad","d":"impractical","from":"t1-b04","title":"Gray Room","text":"Turning on grayscale also turns the whole room gray, so nothing around you looks tempting either.","src":"Track A"},
  {"id":"t1-b05-exaggerate","task":"t1","type":"bad","d":"exaggerate","from":"t1-b05","title":"Thought Paperwork","text":"Parking a thought means filling in a full one-page form about it before you go back to studying.","src":"Track A"},
  {"id":"t1-b05-control","task":"t1","type":"bad","d":"control","from":"t1-b05","title":"AI Thought Sorter","text":"The AI decides which of your parked thoughts are worth keeping and deletes the rest without asking.","src":"Track A"},
  {"id":"t1-b05-impractical","task":"t1","type":"bad","d":"impractical","from":"t1-b05","title":"Thought Twin","text":"A second copy of you appears and works through your parked thoughts while you keep studying.","src":"Track A"},
  {"id":"t1-b06-control","task":"t1","type":"bad","d":"control","from":"t1-b06","title":"Dean's Goal","text":"The dean's office sets your daily study goal for you, in place of the one you chose.","src":"Track A"},
  {"id":"t1-b06-impractical","task":"t1","type":"bad","d":"impractical","from":"t1-b06","title":"Time Bank","text":"Unused study minutes are saved and can be spent later to add extra hours to a single day.","src":"Track A"},

function phone(s){
  var h='<div class="phone"><div class="ph-head"><span class="ph-app">'+esc(s.app)+'</span><span class="ph-sub">'+esc(s.sub||'')+'</span></div>';
  if(s.t==="big"||s.t==="pop"){
    if(s.icon)h+='<div class="ph-icon">'+ICONS[s.icon]+'</div>';
    h+='<p class="ph-big">'+esc(s.big)+'</p>';
    if(s.meter!=null)h+='<div class="ph-meter" aria-hidden="true"><i style="width:'+s.meter+'%"></i></div>';
  } else if(s.t==="list"){
    h+='<div class="ph-rows">'+s.rows.map(function(r){return '<div class="ph-row"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>';}).join('')+'</div>';
  } else if(s.t==="live"){
    h+='<div class="ph-live"><span class="ph-livepill">LIVE</span><svg width="70" height="70" viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="26" r="12" fill="currentColor"></circle><path d="M12 64c2-14 12-21 23-21s21 7 23 21z" fill="currentColor"></path></svg></div>';
  } else if(s.t==="bars"){
    h+='<div class="ph-rows">'+s.bars.map(function(b){return '<div class="ph-bar"><span>'+esc(b[0])+'</span><div class="ph-meter"><i style="width:'+b[1]+'%"></i></div><span class="tnum">'+b[1]+'</span></div>';}).join('')+'</div>';
  }
  if(s.pop)h+='<div class="ph-pop"><b>'+esc(s.pop[0])+'</b><span>'+esc(s.pop[1])+'</span></div>';
  h+='<p class="ph-cap">'+esc(s.cap||'')+'</p>';
  if(s.btn)h+='<span class="ph-btn'+(s.off?' off':'')+'">'+esc(s.btn)+'</span>';
  return h+'</div>';
}

function screensFor(id){
  var sc=SCREENS[id];if(!sc)return [];
  var f=FLOW[id]||{before:[],after:[]};
  var main=Object.assign({},sc.s,{label:f.main||"Main screen"});
  return (f.before||[]).concat([main]).concat(f.after||[]);
}
function phoneViewer(c){
  var list=screensFor(c.id);if(!list.length)return '';
  V.scr=V.scr||{};var i=V.scr[c.id]||0;if(i>=list.length)i=0;
  var cur=list[i];
  return '<figure class="phone-wrap" aria-label="Mock screens of '+esc(c.title)+'">'+
    '<figcaption class="k">What it looks like · screen '+(i+1)+' of '+list.length+'</figcaption>'+
    phone(cur)+
    '<div class="scr-nav"><button type="button" class="scr-arrow" data-a="scr" data-v="-1" aria-label="Previous screen"'+(i===0?' disabled':'')+'>‹</button>'+
    '<div class="scr-chips">'+list.map(function(s,n){return '<button type="button" class="scr-chip" data-a="scrgo" data-v="'+n+'" aria-pressed="'+(n===i)+'">'+(n+1)+' · '+esc(s.label)+'</button>';}).join('')+'</div>'+
    '<button type="button" class="scr-arrow" data-a="scr" data-v="1" aria-label="Next screen"'+(i===list.length-1?' disabled':'')+'>›</button></div></figure>';
}
function planBlock(c){
  var p=PLANS[c.id]||{}, sc=SCREENS[c.id];
  return '<section class="plan" aria-labelledby="ws-h"><p class="lbl">AI plan'+(c.d?' · '+TWISTS[c.d].label:'')+'</p><h2 id="ws-h">'+esc(c.title)+'</h2><p class="planline">'+esc(c.text)+'</p>'+
    '<div class="plan-body"><div class="plan-text">'+
      (sc?'<div><p class="k">Why it helps</p><p>'+esc(sc.pitch)+'</p></div>':'')+
      '<div><p class="k">Who it is for</p><p>'+esc(p.who||'')+'</p></div>'+
      '<div><p class="k">How it works</p><ol>'+(p.steps||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol></div>'+
      '<div><p class="k">A moment of use</p><p>'+esc(p.moment||'')+'</p></div>'+
    '</div>'+(sc?phoneViewer(c):'')+
    '</div></section>';
}

/* ---------- state ---------- */
var app = document.getElementById("app");

var ENDPOINT = "https://script.google.com/macros/s/AKfycbzLE8JTmu64EFrXdLWeHyaPOrllOzkvNK15vCtMuozaMC9gjSAehK_g8laoQADqEYPm/exec";

var REMOTE = /^https:\/\//.test(ENDPOINT);
var QS = new URLSearchParams(location.search);
var RKEY = QS.get("researcher") || "";
var S = null;            // current session
var V = {view:"setup", researchTab:"sessions", poolTask:"all", previewV:null, setupTask:"t1", setupCond:"bad", setupCode:""};
var cap = {db:null, dl:null, tried:false};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nowIso(){return new Date().toISOString();}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2600);}

function newSession(code,task,cond){
  return {sid:uid("s"),participant:code||"anon",task:task,condition:cond,startedAt:nowIso(),updatedAt:nowIso(),
    step:"explore",twist:null,ideas:[],shown:[],rejected:[],works:{},activeKey:null,
    final:{ideaId:null,who:"",how:"",moment:"",limits:""},events:[],submitted:false};
}
function log(type,detail,cardId){
  if(!S)return;
  S.events.push({t:nowIso(),step:S.step,type:type,cardId:cardId||"",detail:detail||""});
  persist();
}

/* ---------- persistence ---------- */
var saveTimer=null, saveState="idle";
function persist(){
  if(!S)return;
  S.updatedAt=nowIso();
  lsSet("iw-current",S);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushRemote,1200);
}
function pushRemote(){
  if(!S)return;
  var hist=lsGet("iw-history")||[];
  hist=hist.filter(function(h){return h.sid!==S.sid;});hist.unshift(JSON.parse(JSON.stringify(S)));lsSet("iw-history",hist.slice(0,30));
  if(!REMOTE){setSaveState("local");return;}
  try{
    fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(S),keepalive:true})
      .then(function(r){setSaveState(r.ok?"shared":"local");},function(){setSaveState("local");});
  }catch(e){setSaveState("local");}
}
function setSaveState(s){saveState=s;var el=document.getElementById("savestate");if(el)el.textContent=saveLabel();}
function saveLabel(){
  if(saveState==="shared")return "Saved for the research team";
  if(saveState==="local")return "Saved on this device only";
  if(saveState==="full")return "Shared storage is full. Saved on this device only";
  return "";
}

/* ---------- card drawing ---------- */
function poolFor(){return CARDS.filter(function(c){return c.task===S.task&&c.type===S.condition;});}
function unseen(list){return list.filter(function(c){return S.shown.indexOf(c.id)<0;});}
function drawInitial(){
  var pool=poolFor(), picks=[];
  if(S.condition==="good"){picks=shuffle(pool).slice(0,3);}
  else{
    var used={};
    shuffle(["exaggerate","control","impractical"]).forEach(function(d){
      var opts=shuffle(pool.filter(function(c){return c.d===d&&!used[c.from];}));
      if(!opts.length)opts=shuffle(pool.filter(function(c){return c.d===d;}));
      if(opts.length){picks.push(opts[0]);used[opts[0].from]=1;}
    });
  }
  picks.forEach(function(c){S.shown.push(c.id);log("card_shown","initial",c.id);});
}
function drawAnother(){
  var opts=shuffle(unseen(poolFor()));
  if(!opts.length){toast("No more suggestions in this set.");return;}
  S.shown.push(opts[0].id);log("card_shown","show_another",opts[0].id);render();
}
function drawTwist(){
  var d=S.twist;if(!d){toast("Pick a flaw first.");return;}
  var left=unseen(poolFor());
  var opts=shuffle(d==="mix"?left:left.filter(function(c){return c.d===d;}));
  if(!opts.length){toast(d==="mix"?"No more suggestions in this set.":"No more suggestions with this flaw. Try another one.");return;}
  var c=opts[0];S.shown.push(c.id);
  S.works[c.id]=S.works[c.id]||blankWork(c.id,true);S.works[c.id].viaTwist=true;
  S.picked=S.picked||{};S.picked[c.id]=d;
  var pw=activeWork();if(pw)snapshot(pw);
  S.activeKey=c.id;V.previewV=null;
  log("card_shown","flaw_choice:"+d,c.id);log("card_opened","auto",c.id);render();
}
function leftFor(d){var left=unseen(poolFor());return d==="mix"?left.length:left.filter(function(c){return c.d===d;}).length;}

/* ---------- workspace ---------- */
function blankWork(key,twist){return {key:key,tab:"critique",critique:"",extract:"",nothing:false,name:"",body:"",versions:[],ideaId:null,viaTwist:!!twist};}
function activeWork(){return S.activeKey?S.works[S.activeKey]:null;}
function openCard(id){
  if(!S.works[id])S.works[id]=blankWork(id,false);
  S.activeKey=id;V.previewV=null;log("card_opened","",id);render();
}
function openOwn(){
  var key=uid("own");S.works[key]=blankWork(key,false);S.works[key].tab="transform";S.works[key].own=true;
  S.activeKey=key;V.previewV=null;log("own_idea_started","",""); render();
}
function snapshot(w){
  var last=w.versions[w.versions.length-1];
  var cur={critique:w.critique,extract:w.nothing?"(nothing worth keeping)":w.extract,name:w.name,body:w.body};
  if(!cur.critique&&!cur.extract&&!cur.name&&!cur.body)return;
  if(last&&last.critique===cur.critique&&last.extract===cur.extract&&last.name===cur.name&&last.body===cur.body)return;
  cur.n=w.versions.length+1;cur.t=nowIso();w.versions.push(cur);
  log("version_saved","v"+cur.n,w.own?"":w.key);
}
function setTab(tab){var w=activeWork();if(!w)return;snapshot(w);w.tab=tab;V.previewV=null;log("tab_view",tab,w.own?"":w.key);render();}
function saveToIdeas(){
  var w=activeWork();if(!w)return;
  if(!w.body.trim()&&!w.name.trim()){toast("Describe your concept first.");return;}
  snapshot(w);
  var text=w.body.trim(), name=w.name.trim();
  if(w.ideaId){var it=S.ideas.find(function(i){return i.id===w.ideaId;});if(it){it.text=text;it.name=name;}}
  else{var id=uid("i");w.ideaId=id;S.ideas.push({id:id,text:text,name:name,source:w.own?"own":"card",cardId:w.own?"":w.key});}
  log("saved_to_ideas",name||text.slice(0,60),w.own?"":w.key);toast("Saved to your ideas.");render();
}

/* ---------- CSV ---------- */
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function sessionRows(s){
  var rows=[];
  (s.events||[]).forEach(function(e){
    var c=CARD[e.cardId]||{};
    rows.push([s.sid,s.participant,s.task,s.condition,e.t,e.step,e.type,e.cardId,c.type||"",c.d?TWISTS[c.d].rname:"",e.detail]);
  });
  (s.ideas||[]).forEach(function(i){
    rows.push([s.sid,s.participant,s.task,s.condition,"","final","idea_record",i.cardId||"",i.source,"",(i.name?i.name+": ":"")+i.text]);
  });
  if(s.submitted&&s.final){
    var f=s.final;rows.push([s.sid,s.participant,s.task,s.condition,s.updatedAt,"final","final_concept",f.ideaId||"","","","who: "+f.who+" | how: "+f.how+" | moment: "+f.moment+" | limits: "+f.limits]);
  }
  return rows;
}
function toCsv(list){
  var head=["session_id","participant","task","card_set","time","step","event","card_id","card_type","distortion","detail"];
  var out=[head.join(",")];
  list.forEach(function(s){sessionRows(s).forEach(function(r){out.push(r.map(csvCell).join(","));});});
  return out.join("\n");
}
function offerCsv(list,name){
  if(!list.length){toast("No sessions to export yet.");return;}
  var csv=toCsv(list);
  try{
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast("Export ready.");
  }catch(e){showCsvFallback(csv);}
}
function showCsvFallback(csv){V.csvText=csv;render();toast("Downloads are unavailable here. Copy the CSV below.");}

function flawSummary(s){
  var n={exaggerate:0,control:0,impractical:0,mix:0};
  Object.keys(s.picked||{}).forEach(function(id){var d=s.picked[id];if(n[d]!=null)n[d]++;});
  var parts=[];if(n.exaggerate)parts.push("Extreme "+n.exaggerate);if(n.control)parts.push("Who decides "+n.control);if(n.impractical)parts.push("Unrealistic "+n.impractical);if(n.mix)parts.push("Mixed "+n.mix);
  return parts.length?parts.join(", "):"None yet";
}

    body='<form id="rkeyform" class="panel" style="gap:14px;max-width:460px"><h2 style="font-size:22px">Enter the researcher key</h2><p class="muted" style="font-size:14px">Session data is protected. Use the key you set in the Apps Script.</p><div class="field"><label for="rkey">Researcher key</label><input id="rkey" class="input" type="password" autocomplete="off"></div><div class="row"><button type="submit" class="btn btn-primary">Show sessions</button></div></form>';
  } else if(V.researchTab==="sessions"){
    var list=allSessions();
    var src=sessionsLive?"Showing sessions from the Google Sheet.":(REMOTE&&RKEY?"Loading sessions from the Google Sheet…":"Not connected to the Google Sheet. Showing sessions saved on this device.");
    body='<div class="row between"><p class="muted" style="font-size:14px">'+src+'</p><button type="button" class="btn btn-outline" data-a="export-all"'+(list.length?'':' disabled')+'>Export all sessions (CSV)</button></div>';
    if(!list.length)body+='<div class="panel empty"><h2 style="font-size:22px">No sessions yet</h2><p class="lead">Sessions appear here as soon as someone starts one from the setup screen.</p><button type="button" class="btn btn-primary" data-a="home">Go to setup</button></div>';
    else body+='<div class="tablebox"><table><thead><tr><th scope="col">Participant</th><th scope="col">Task</th><th scope="col">Flaws picked</th><th scope="col">Started</th><th scope="col">Ideas</th><th scope="col">Cards shown</th><th scope="col">Final concept</th><th scope="col">Status</th><th scope="col">Export</th></tr></thead><tbody>'+
      list.map(function(s){var fin=(s.ideas||[]).find(function(i){return s.final&&i.id===s.final.ideaId;});
        return '<tr><td><b>'+esc(s.participant)+'</b></td><td>'+esc((TASKS[s.task]||{}).short||s.task)+'</td><td>'+esc(flawSummary(s))+'</td><td class="tnum">'+esc(new Date(s.startedAt).toLocaleString())+'</td><td class="tnum">'+(s.ideas||[]).length+'</td><td class="tnum">'+(s.shown||[]).length+'</td><td style="max-width:260px">'+esc(fin?(fin.name||fin.text):"Not chosen")+'</td><td>'+(s.submitted?'<span class="okc">Submitted</span>':'<span class="muted">In progress</span>')+'</td><td><button type="button" class="btn btn-ghost" style="min-height:36px;padding:0 12px" data-a="export-sid" data-id="'+esc(s.sid)+'">CSV</button></td></tr>';}).join("")+'</tbody></table></div>';
    if(V.csvText)body+=csvBox();
  } else {
    var rows=CARDS.filter(function(c){return V.poolTask==="all"||c.task===V.poolTask;});
    body='<div class="row"><span class="muted" style="font-weight:600">Task</span>'+[["all","All"],["t1","Task 1"],["t2","Task 2"]].map(function(o){return '<button type="button" class="vchip" style="min-height:38px;padding:0 14px" aria-pressed="'+(V.poolTask===o[0])+'" data-a="ptask" data-v="'+o[0]+'">'+o[1]+'</button>';}).join("")+'<span class="muted tnum" style="font-size:13px">'+rows.length+' cards</span></div>'+
      '<div class="tablebox"><table><thead><tr><th scope="col">ID</th><th scope="col">Task</th><th scope="col">Distortion</th><th scope="col">Source</th><th scope="col">Title</th><th scope="col" style="width:40%">Card text, as participants see it</th></tr></thead><tbody>'+
      rows.map(function(c){return '<tr><td><b>'+c.id+'</b></td><td>'+(c.task==="t1"?"1":"2")+'</td><td>'+(c.d?TWISTS[c.d].rname:'<span class="muted">None</span>')+'</td><td>'+(c.src||'Example')+'</td><td>'+esc(c.title)+'</td><td>'+esc(c.text)+'</td></tr>';}).join("")+'</tbody></table></div>'+
      '<p class="muted" style="font-size:13px">Each card is a workable idea with one deliberate distortion, adapted from de Bono\'s provocation methods. Participants pick which flaw they want, and the system draws a card of that type.</p>';
  }
  return '<main><div class="wrap" style="display:flex;flex-direction:column;gap:18px"><div class="row between"><div><p class="eyebrow">Hidden from participants</p><h1 style="font-size:32px">Researcher view</h1></div><button type="button" class="btn btn-ghost" data-a="home">Back to setup</button></div>'+tabs+body+'</div></main>';
}

/* ---------- render ---------- */
function render(){
  var html=topbar();
  if(V.view==="setup")html+=viewSetup();
  else if(V.view==="research")html+=viewResearch();
  else if(S.submitted)html+=viewDone();
  else if(S.step==="ideas")html+=viewIdeas();
  else if(S.step==="explore")html+=viewExplore();
  else html+=viewFinal();
  app.innerHTML=html;
  tick();
}
function tick(){
  var el=document.getElementById("timer");if(!el)return;
  var s=Math.floor((Date.now()-stepStart)/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" in this step";
}
setInterval(tick,1000);

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-a"), v=b.getAttribute("data-v"), id=b.getAttribute("data-id");
  if(a==="twist"||a==="pick-final"||a==="nothing")return; // handled on change
  switch(a){
    case "home": stopSessionsSub(); V.view="setup"; V.csvText=null; render(); break;
    case "research": V.view="research"; V.csvText=null; startSessionsSub(); render(); break;
    case "resume": S=lsGet("iw-current"); V.view="session"; stepStart=Date.now(); log("session_resumed","",""); render(); break;
    case "new": S=null; try{localStorage.removeItem("iw-current");}catch(_){ } V.view="setup"; V.csvText=null; render(); break;
    case "to-explore": go("explore"); break;
    case "to-final": go("final"); break;
    case "mode": S.mode=v; log("mode_change",v,""); render(); break;
    case "draw-twist": drawTwist(); break;
    case "another": drawAnother(); break;
    case "own": openOwn(); break;
    case "open": openCard(id); break;
    case "reject": S.rejected.push(id); log("card_rejected","",id); if(S.activeKey===id)S.activeKey=null; render(); break;
    case "reject-active": var w=activeWork(); if(w){snapshot(w);S.rejected.push(w.key);log("card_rejected","from_workspace",w.key);S.activeKey=null;render();} break;
    case "tab": setTab(v); break;
    case "chip": var w2=activeWork(); if(w2){w2.critique=(w2.critique?w2.critique.replace(/\s*$/,"")+"\n":"")+v+" ";log("prompt_used",v,w2.key);render();var ta=document.getElementById("f-critique");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}} break;
    case "scr": case "scrgo": var ak=S&&S.activeKey; if(!ak)break; V.scr=V.scr||{}; var n=screensFor(ak).length;
      var ni=a==="scr"?(V.scr[ak]||0)+Number(v):Number(v); ni=Math.max(0,Math.min(n-1,ni)); V.scr[ak]=ni; log("screen_view",String(ni+1),ak); render(); break;
    case "ver": V.previewV=V.previewV===Number(v)?null:Number(v); render(); break;
    case "save-idea": saveToIdeas(); break;
    case "rtab": V.researchTab=v; V.csvText=null; render(); break;
    case "ptask": V.poolTask=v; render(); break;
    case "export-all": offerCsv(allSessions(),"idea-workbench-sessions.csv"); break;
    case "export-sid": var s=allSessions().find(function(x){return x.sid===id;}); if(s)offerCsv([s],"session-"+(s.participant||"anon")+".csv"); break;
    case "export-one": offerCsv([S],"session-"+S.participant+".csv"); break;
    case "copy-csv": var t=document.getElementById("csvout"); if(!t)break;
      try{navigator.clipboard.writeText(t.value).then(function(){toast("CSV copied.");},function(){t.select();toast("Press Ctrl+C or Cmd+C to copy.");});}catch(_){t.select();toast("Press Ctrl+C or Cmd+C to copy.");}
      break;
  }
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.name==="task")V.setupTask=t.value;
  if(t.name==="cond")V.setupCond=t.value;
  if(!S)return;
  var a=t.getAttribute("data-a");
  if(a==="twist"){S.twist=t.value;log("flaw_selected",t.value,"");render();}
  if(a==="pick-final"){S.final.ideaId=t.value;log("final_selected","",(S.ideas.find(function(i){return i.id===t.value;})||{}).cardId||"");render();}
  if(a==="nothing"){var w=activeWork();if(w){w.nothing=t.checked;log("nothing_worth_keeping",String(t.checked),w.key);render();}}
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="pcode"){V.setupCode=t.value;return;}
  if(!S)return;
  var f=t.getAttribute("data-f"), ff=t.getAttribute("data-ff");
  if(f){var w=activeWork();if(w){w[f]=t.value;persist();}}
  if(ff){S.final[ff]=t.value;persist();}
});
app.addEventListener("focusout",function(e){
  var t=e.target;if(!S)return;
  var f=t.getAttribute&&t.getAttribute("data-f");
  if(f&&t.value)log("text_edit",f+" ("+t.value.length+" chars)",S.activeKey&&!S.works[S.activeKey].own?S.activeKey:"");
});
app.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==="rkeyform"){
    var k=(document.getElementById("rkey").value||"").trim();if(!k)return;
    RKEY=k;sessionsLive=null;render();startSessionsSub();
  } else if(f.id==="setup"){
    S=newSession((V.setupCode||"").trim(),V.setupTask,"bad");V.view="session";stepStart=Date.now();
    log("session_start",S.task+" / "+S.condition,"");render();
  } else if(f.id==="addidea"){
    var inp=document.getElementById("newidea");var txt=(inp.value||"").trim();if(!txt)return;
    S.ideas.push({id:uid("i"),text:txt,name:"",source:"solo",cardId:""});log("idea_added",txt,"");render();
    var again=document.getElementById("newidea");if(again)again.focus();
  } else if(f.id==="finalform"){
    var fi=S.final;if(!fi.ideaId){toast("Pick an idea first.");return;}
    if(!fi.who.trim()||!fi.how.trim()){toast("Fill in who it is for and how it works.");return;}
    S.submitted=true;log("submitted","",(S.ideas.find(function(i){return i.id===fi.ideaId;})||{}).cardId||"");
    clearTimeout(saveTimer);pushRemote();render();window.scrollTo(0,0);
  }
});

/* ---------- researcher live list ---------- */
function startSessionsSub(){
  if(!REMOTE||!RKEY)return;
  fetch(ENDPOINT+"?key="+encodeURIComponent(RKEY)).then(function(r){return r.json();}).then(function(d){
    sessionsLive=Array.isArray(d)?d:null;if(!sessionsLive)toast("Could not load sessions. Check the researcher key.");
    if(V.view==="research")render();
  },function(){sessionsLive=null;if(V.view==="research")render();});
}
function stopSessionsSub(){if(unsubSessions){try{unsubSessions();}catch(e){}}unsubSessions=null;}

/* ---------- boot ---------- */
render();
(async function(){
  try{
    var qp=(QS.get("p")||"").trim(), qt=QS.get("task");
    if(qp&&(qt==="t1"||qt==="t2")){
      var prev=lsGet("iw-current");
      if(prev&&!prev.submitted&&prev.participant===qp&&prev.task===qt){S=prev;log("session_resumed","","");}
      else{S=newSession(qp,qt,"bad");log("session_start",S.task+" / "+S.condition+" / via link","");}
      V.view="session";stepStart=Date.now();render();
    }
  }catch(e){}
  cap.tried=true;
  if(S)pushRemote();
  if(V.view==="research"){startSessionsSub();render();}
  else setSaveState(saveState==="idle"&&S?(REMOTE?"idle":"local"):saveState);
})();
})();
</script>
</body>
</html>
